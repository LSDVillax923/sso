# Proveedor de SMS externo simulado (en lugar de Twilio)
server:
  port: 8096

spring:
  application:
    name: gateway-sms
  datasource:
    # bd_sms: base del proveedor de SMS
    url: ${BD_SMS_URL:jdbc:h2:file:./datos/bd_sms}
    username: sms
    password: sms
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

gateway:
  # si se define, debe coincidir con SMS_API_KEY de notificar-service (cabecera Authorization: Bearer)
  api-key: ${SMS_API_KEY:}
  reintentos: 3

management:
  endpoints:
    web:
      exposure:
        include: health
