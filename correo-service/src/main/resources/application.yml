# Servidor de correo externo simulado (en lugar de smtp.gmail.com)
server:
  port: 8095

spring:
  application:
    name: correo-service
  datasource:
    # bd_correo: base del servidor de correo
    url: ${BD_CORREO_URL:jdbc:h2:file:./datos/bd_correo}
    username: correo
    password: correo
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

correo:
  # notificar-service llega con SMTP_HOST y SMTP_PORT apuntando aquí
  puerto: ${CORREO_PUERTO:587}

management:
  endpoints:
    web:
      exposure:
        include: health
