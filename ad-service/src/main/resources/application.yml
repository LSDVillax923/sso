# PC2 · 192.168.1.102 · contenedor ad (en lugar de OpenLDAP; use uno de los dos)
server:
  port: 8097

spring:
  application:
    name: ad-service

ad:
  # LDAPS 636 con certificado propio (se genera ad-ldaps.p12 la primera vez) y LDAP 389 para IntegraAD sin TLS
  puerto: ${AD_PUERTO:636}
  puerto-ldap: ${AD_PUERTO_LDAP:389}
  keystore: ${AD_KEYSTORE:ad-ldaps.p12}
  keystore-clave: ${AD_KEYSTORE_CLAVE:cambiar}
  base: dc=sso,dc=local
  # bd_directorio: mismo LDIF que infra/ad/clientes.ldif
  base-datos: ${AD_BD:classpath:bd_directorio.ldif}
  admin-dn: ${AD_ADMIN:cn=admin,dc=sso,dc=local}
  admin-clave: ${AD_PASS:admin}

management:
  endpoints:
    web:
      exposure:
        include: health
