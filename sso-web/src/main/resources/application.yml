# PC1 · 192.168.1.101 · DMZ
server:
  port: 8443
  ssl:
    # Para HTTPS: genere el certificado (ver README) y arranque con SSL_ENABLED=true
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE:file:sso-web.p12}
    key-store-password: ${SSL_PASS:cambiar}
    key-store-type: PKCS12

spring:
  application:
    name: sso-web
  cloud:
    discovery:
      client:
        simple:
          instances:
            sso-monolito:
              - uri: ${MONOLITO_1:http://192.168.1.102:8080}
              - uri: ${MONOLITO_2:http://192.168.1.102:8081}

sso:
  origenes-permitidos: ${ORIGENES:http://192.168.1.101:8443,https://192.168.1.101:8443,http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health
