# PC1 · 192.168.1.101 · contenedor Docker
server:
  port: 8091

spring:
  application:
    name: ofac-service
  datasource:
    url: ${BD_OFAC_URL:jdbc:postgresql://192.168.1.101:5433/bd_ofac}
    username: ${BD_OFAC_USER:ofac}
    password: ${BD_OFAC_PASS:ofac}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health
