# PC2 · 192.168.1.102 · contenedor Docker propio (nodo SIN) con bd_sin en su propio contenedor
server:
  port: 8092

spring:
  application:
    name: sin-service
  datasource:
    url: ${BD_SIN_URL:jdbc:postgresql://192.168.1.102:5434/bd_sin}
    username: ${BD_SIN_USER:sin}
    password: ${BD_SIN_PASS:sin}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:192.168.1.102}
    port: 5672
    username: ${RABBIT_USER:sso}
    password: ${RABBIT_PASS:sso}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s

management:
  endpoints:
    web:
      exposure:
        include: health
