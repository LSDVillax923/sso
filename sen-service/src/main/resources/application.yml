# PC2 · 192.168.1.102 · contenedor Docker propio (nodo SEN) con bd_sen en su propio contenedor
server:
  port: 8093

spring:
  application:
    name: sen-service
  datasource:
    url: ${BD_SEN_URL:jdbc:postgresql://192.168.1.102:5435/bd_sen}
    username: ${BD_SEN_USER:sen}
    password: ${BD_SEN_PASS:sen}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:192.168.1.102}
    port: 5672
    username: ${RABBIT_USER:sso}
    password: ${RABBIT_PASS:sso}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s

management:
  endpoints:
    web:
      exposure:
        include: health
